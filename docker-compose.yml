# 一键启动全栈：FastAPI 后端 + nginx 前端（复用宿主机已有的 MySQL）
# 用法：
#   1. 在本文件同目录创建 .env，写入 LLM_API_KEY=sk-xxx（默认千问，见 backend/.env.example）
#   2. 确保本机 MySQL 已运行，且已建库 course_agent 与用户 course（见 README）
#   3. docker compose up -d --build
#   4. 访问 http://localhost:5173
services:
  backend:
    build: ./backend
    environment:
      # host.docker.internal = 宿主机；容器后端直接使用本机 MySQL，与本地开发共用同一份数据
      DATABASE_URL: mysql+pymysql://course:123456@host.docker.internal:3306/course_agent?charset=utf8mb4
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEMESTER_START: ${SEMESTER_START:-2026-09-07}
      # Redis 可选：配 REDIS_URL 即启用限流共享/熔断共享/审批取消跨进程/两级缓存
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads:/app/data/uploads   # 上传的课程资料持久化
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  # 多 worker 跨进程状态（限流/熔断/审批取消信号/缓存）；不用 Redis 时
  # 把 backend 的 REDIS_URL 置空即可（全部能力自动退回进程内缺省路径）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uploads:
  redis-data:
